<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AI Movie View — 人物、声音与分镜的 JSON 项目查看器">
  <title>AI Movie View</title><link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23347654'/%3E%3Cpath d='M25 18l23 14-23 14z' fill='white'/%3E%3C/svg%3E">
</head>
<body>
  <div id="loading" class="flex min-h-screen items-center justify-center muted" role="status">正在连接登录服务…</div>
  <main id="login" hidden class="mx-auto flex min-h-screen max-w-5xl items-center px-6 py-16">
    <div class="grid w-full gap-14 md:grid-cols-2 md:items-center">
      <div><div class="mb-10 flex items-center gap-3"><span class="flex h-10 w-10 items-center justify-center rounded-xl bg-accent text-white" aria-hidden="true">▶</span><span class="font-semibold tracking-tight">AI Movie View</span></div><p class="eyebrow mb-4">PROJECT VIEWER</p><h1 class="text-3xl font-semibold leading-tight tracking-tight sm:text-4xl md:text-3xl lg:text-4xl">人物、声音、分镜。<br><span class="text-gray-400">在一处看完整个故事。</span></h1><p class="mt-6 muted">登录后导入你的项目 JSON，查看创作设定与生成素材。</p></div>
      <form id="login-form" class="rounded-2xl border border-gray-200 bg-white p-7 sm:p-9">
        <h2 class="text-2xl font-semibold">登录</h2><p class="mb-7 mt-2 muted">使用 VibeCoding Japan 账号</p>
        <fieldset id="login-fields" class="space-y-5">
          <div><label for="email" class="mb-2 block text-sm font-medium">邮箱</label><input id="email" class="field" type="email" autocomplete="username" required></div>
          <div><label for="password" class="mb-2 block text-sm font-medium">密码</label><input id="password" class="field" type="password" autocomplete="current-password" required></div>
          <button id="login-submit" class="primary w-full" type="submit">登录</button>
          <button id="reset-password" class="block w-full text-center text-sm text-gray-500" type="button">忘记密码？</button>
        </fieldset>
        <p id="login-error" role="alert" class="mt-4 text-sm leading-6 text-red-700"></p>
        <p id="login-message" role="status" class="mt-3 text-sm leading-6 text-accent"></p>
        <button id="retry-auth" type="button" hidden class="secondary mt-4">重新连接</button>
      </form>
    </div>
  </main>
  <div id="workspace" hidden>
    <header class="border-b border-gray-200 bg-white"><div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-5 py-5 sm:px-8"><a href="/" class="flex items-center gap-3 text-lg font-semibold tracking-tight"><span class="flex h-8 w-8 items-center justify-center rounded-lg bg-accent text-sm text-white" aria-hidden="true">▶</span>AI Movie View</a><div class="flex flex-wrap items-center justify-end gap-4"><div class="flex items-center gap-2"><label for="speech-language" class="text-xs text-gray-500">朗读语言</label><select id="speech-language" class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm"><option value="zh-CN">中文</option><option value="ja-JP">日文</option><option value="en-US">英文</option><option value="ko-KR">韩文</option></select></div><span id="user-label" class="max-w-44 truncate text-xs text-gray-500"></span><button id="logout" class="text-sm font-medium text-gray-500 hover:text-ink">退出登录</button></div></div></header>
    <main class="mx-auto max-w-7xl px-5 pb-20 pt-10 sm:px-8">
      <div class="flex flex-wrap items-center justify-between gap-5"><div><p class="eyebrow">PROJECT LIBRARY</p><p class="mt-2 muted">导入 JSON，编辑人物、台词与视频提示词。</p></div><div class="flex flex-wrap gap-3"><button id="load-sample" class="secondary">加载示例</button><button id="import-button" class="primary">导入项目 JSON</button><button id="export-button" type="button" class="export-button" disabled>导出 JSON</button><input id="file-input" hidden type="file" accept=".json,application/json"></div></div>
      <p id="notice" role="status" class="mt-4 text-sm text-accent"></p><p id="save-status" role="status" class="mt-2 text-xs text-gray-500"></p><p id="file-error" role="alert" class="mt-3 text-sm text-red-700"></p>
      <div id="empty" class="mt-12 rounded-xl border border-dashed border-gray-300 px-6 py-20 text-center"><p class="text-xl font-semibold">打开一个故事</p><p class="mt-3 muted">拖放项目 JSON 到页面，或点击「导入项目 JSON」。</p><p class="mt-2 text-xs text-gray-400">项目与修改会自动保存在当前浏览器。</p></div>
      <section id="project" hidden>
        <div class="pb-8 pt-10"><p id="project-meta" class="eyebrow"></p><h1 id="project-title" class="mt-3 max-w-4xl text-3xl font-semibold leading-tight tracking-tight sm:text-4xl"></h1><p id="project-outline" class="mt-5 max-w-4xl muted"></p><div id="project-stats" class="mt-6 flex flex-wrap gap-x-7 gap-y-2 text-sm text-gray-500"></div></div>
        <div class="sticky top-0 z-10 border-y border-gray-200 bg-paper/95 backdrop-blur"><nav role="tablist" aria-label="项目展示" class="flex gap-8 overflow-x-auto"><button id="tab-overview" class="tab" role="tab" aria-selected="true" aria-controls="content" data-tab="overview">项目概览</button><button id="tab-characters" class="tab" role="tab" aria-selected="false" aria-controls="content" data-tab="characters">人物展示</button><button id="tab-audio" class="tab" role="tab" aria-selected="false" aria-controls="content" data-tab="audio">声音展示</button><button id="tab-storyboard" class="tab" role="tab" aria-selected="false" aria-controls="content" data-tab="storyboard">分镜展示</button></nav></div>
        <div id="speech-toolbar" hidden class="mt-6 flex flex-wrap items-center gap-3"><button id="read-all" type="button" class="primary">▶ 朗读全部</button><button id="pause-speech" type="button" class="secondary" disabled>暂停</button><button id="stop-speech" type="button" class="secondary" disabled>停止</button><span id="speech-status" role="status" class="text-sm text-accent"></span><p id="speech-hint" class="w-full text-xs text-gray-500">使用所选语言的语音朗读原文，不自动翻译。</p></div>
        <div id="filters" hidden class="mt-6 flex flex-wrap gap-3"><label class="sr-only" for="search">搜索镜头</label><input id="search" class="field max-w-md" type="search" placeholder="搜索镜头、对白、提示词…"><label class="sr-only" for="segment-filter">筛选段落</label><select id="segment-filter" class="field w-auto"><option value="">全部段落</option></select><label class="sr-only" for="mode-filter">筛选模式</label><select id="mode-filter" class="field w-auto"><option value="">全部模式</option><option>I2VA</option><option>FL2VA</option><option>Ref2VA</option></select></div>
        <div id="content" role="tabpanel" aria-labelledby="tab-overview" class="pt-8"></div>
      </section>
    </main>
    <footer class="border-t border-gray-200 px-5 py-6 text-center text-xs text-gray-400">AI Movie View · JSON Project Viewer</footer>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
